#####################################################
## Spring Boot Application Configuration
#####################################################
#
## Application Name
#spring.application.name=Module
#
#####################################################
## MongoDB Configuration
#####################################################
## MongoDB Connection URI with Replica Set
## Replica set is REQUIRED for transactions in MongoDB
## Single node replica set setup for development
#spring.mongodb.uri=mongodb://localhost:27017/moduledb?replicaSet=rs0
#
## Enable automatic index creation
## Indexes are created based on @Indexed annotations in entity classes
#spring.data.mongodb.auto-index-creation=true
#
## MongoDB database name
#spring.data.mongodb.database=moduledb
#
#####################################################
## Server Configuration
#####################################################
## Session Configuration
#server.servlet.session.timeout=30m
#server.servlet.session.cookie.http-only=true
#server.servlet.session.cookie.secure=false
#
#####################################################
## Logging Configuration
#####################################################
## Set root logger level
#logging.level.root=INFO
#
## Spring Security logging - Set to DEBUG to see authentication flow
#logging.level.org.springframework.security=DEBUG
#
## Spring Web logging
#logging.level.org.springframework.web=INFO
#
## MongoDB logging
#logging.level.org.springframework.data.mongodb=INFO
#
## Application specific logging
#logging.level.com.example.module=DEBUG
#
## Log format with timestamp and level
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
#
#####################################################
## Spring MVC Configuration
#####################################################
## Enable detailed error messages
#server.error.include-message=always
#server.error.include-binding-errors=always
