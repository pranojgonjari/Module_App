spring:
  application:
    name: Module

  data:
    mongodb:
      uri: mongodb://localhost:27017/moduledb?replicaSet=rs0
      auto-index-creation: true

server:
  port: 8080

  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false

  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: DEBUG
    com.example.module: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# External API Configuration
# Weather API from api-ninjas.com
weather:
  api:
    # Base URL for weather API endpoint
    base-url: https://api.api-ninjas.com/v1/weather
    # API Key for authentication (keep this secure in production!)
    # Should be stored in environment variables: export WEATHER_API_KEY=your_key
    # Then use: key: ${WEATHER_API_KEY}
    key: GfuKjCTXvstEGHRZzBsSKrcLBpTWo4M0dS1BFjG6
